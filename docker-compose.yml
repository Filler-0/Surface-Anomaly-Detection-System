version: "3.9"

services:
  db:
    image: postgres:16
    container_name: anomaly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sads_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  app:
    build: .
    container_name: anomaly_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: sads_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./temp_runs:/app/temp_runs

volumes:
  postgres_data: